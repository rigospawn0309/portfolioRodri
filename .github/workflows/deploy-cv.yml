name: Deploy CV

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Copy dist to VPS
        uses: appleboy/scp-action@v0.1.3
        with:
          host: 212.227.98.77
          username: rodrigo
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: "/home/rodrigo/apps/traefik/cv"

      - name: Restart CV container
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: 212.227.98.77
          username: rodrigo
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/rodrigo/apps/traefik
            docker compose restart cv